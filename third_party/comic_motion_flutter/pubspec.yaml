name: comic_motion_flutter
description: >-
  Ready-to-use Flutter widgets for comic_motion output: MotionGifView
  playback with placeholder crossfade and ParallaxGyroView gyro/touch
  parallax.
version: 0.3.0
repository: https://github.com/nexhub-app/comic-motion-effects
topics:
  - flutter
  - animation
  - gif
  - parallax
  - comic

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  comic_motion: ^1.3.1
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image: ^4.2.0 # 测试 fixture 生成（PNG/GIF 字节）
