# =============================================================================
# NexHub 鸿蒙（OHOS）构建工作流
# -----------------------------------------------------------------------------
# 触发：推送 v* 标签自动发布（与 build.yml 同一标签联动，HAP 追加到同一
#       Release 页，发布说明由 build.yml 写入、本工作流不覆盖正文）；
#       也支持网页手动 Run workflow 试跑（产物走 artifact 下载）。
#
# 产物：未签名 HAP（unsigned）——发布物一律不带签名，安装签名由下载用户
#       自行完成（侧载惯例，端侧签名安装工具可直接安装 unsigned 包）。
#
# 依赖事实（2026-10-18 核实）：
#   - 社区 action ErBWs/setup-ohos@v1 安装 DevEco 命令行工具（26.0.0.821
#     对齐工程 compatibleSdkVersion 26.0.0），支持缓存；同类 Flutter 鸿蒙
#     应用现役发布工作流同款。
#   - flutter-ohos SDK：atomgit oh-flutter/flutter_flutter tag
#     3.47.7-ohos-1.0.0（本机同源实测）。
#   - 仓库版 ohos/build-profile.json5 signingConfigs 为空数组 → CI 产物
#     天然 unsigned，无需任何签名材料。
#   - libmpv 内核由 media_kit_libs_ohos 的 CMake 构建期从 GitHub 下载校验，
#     CI 直连无墙，无需预置。
#
# 已知风险：
#   - gitcode 镜像随机挂死（本地经验）→ pub get 包 GNU timeout + 重试；
#     若仍偶发挂起，再引入预拉镜像步骤。
#   - setup-ohos 为第三方 action，若失效可改为手动下载命令行工具包解压。
# =============================================================================

name: build-ohos

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ohos:
    name: HarmonyOS HAP (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: "26.0.0.821"
          cache: true

      - name: Setup flutter-ohos SDK
        run: |
          git clone --depth 1 -b 3.47.7-ohos-1.0.0 \
            https://atomgit.com/oh-flutter/flutter_flutter.git "$HOME/flutter-ohos"
          echo "$HOME/flutter-ohos/bin" >> "$GITHUB_PATH"

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor || true

      - name: 获取依赖
        run: |
          for i in 1 2 3; do
            timeout 900 flutter pub get 2>&1 && exit 0
            echo "pub get failed or hung (attempt $i), retrying..."
            sleep 10
          done
          exit 1

      - name: 生成国际化资源
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true

      - name: 编译 HAP（release，未签名）
        run: |
          set -o pipefail
          flutter build hap --release --target-platform ohos-arm64 \
            --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} \
            --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} \
            --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} \
            --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} \
            2>&1 | tee ohos_build.log || { echo "=== OHOS BUILD FAILED ===" && tail -n 500 ohos_build.log; exit 1; }

      - name: 收集产物
        run: |
          cp ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
            NexHub-ohos-arm64-unsigned.hap
          ls -la NexHub-ohos-arm64-unsigned.hap

      - name: 上传产物（手动试跑）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ohos-hap
          path: NexHub-ohos-arm64-unsigned.hap
          if-no-files-found: error

      - name: 发布到 GitHub Releases
        # ohos 标签时本工作流是唯一发布流（build.yml 各 job 对 ohos 标签跳过），
        # 由本步骤创建 Release 并写入正文；与 build.yml 共用同一份
        # RELEASE_BODY.md，两个工作流先后更新同一正文内容一致，互不冲突。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NexHub ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            NexHub-ohos-arm64-unsigned.hap
