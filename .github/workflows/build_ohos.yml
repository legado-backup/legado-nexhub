# =============================================================================
# NexHub 鸿蒙（OHOS）构建工作流
# -----------------------------------------------------------------------------
# 触发：推送 v* 标签自动发布（与 build.yml 同一标签联动：标签名含 "ohos" 时
#       build.yml 全平台 job 跳过，本工作流单独发布鸿蒙包；普通 v* 标签时
#       本工作流把 HAP 追加到同一 Release）；也支持网页手动 Run workflow
#       试跑（产物走 artifact）。
#
# 产物：未签名 HAP（unsigned）——发布物一律不带签名，安装签名由下载用户
#       自行完成（侧载惯例，端侧签名安装工具可直接安装 unsigned 包）。
#
# 平台说明（2026-10-18 实测定案）：必须使用 Windows runner。
#   flutter-ohos 3.47.7-ohos-1.0.0 的 Release 只发布了 Windows 定制 Dart SDK
#   （Linux x64 定制 SDK 未发布，Linux runner 引导回落官方 SDK 后因
#   Abi.ohos* 成员缺失而失败）；Windows 引导已在本机构建验证。
#
# 依赖事实（2026-10-18 核实）：
#   - ErBWs/setup-ohos@v2 支持 Windows runner（README：macOS/Windows 须用
#     v2 + CLI 6.1.1.280 以上；26.0.0.821 提供 windows-amd64 SDK 包，
#     对齐工程 compatibleSdkVersion 26.0.0）。
#   - flutter-ohos SDK：atomgit oh-flutter/flutter_flutter tag
#     3.47.7-ohos-1.0.0（本机同源实测；gitcode 无 3.47 线 tag）。
#   - 仓库版 ohos/build-profile.json5 signingConfigs 为空数组 → CI 产物
#     天然 unsigned，无需任何签名材料。
#   - libmpv 内核由 media_kit_libs_ohos 的 CMake 构建期从 GitHub 下载校验，
#     CI 直连无墙，无需预置。
#
# 已知风险：
#   - gitcode 镜像随机挂死（本地经验）→ pub get 包 GNU timeout + 重试；
#     若仍偶发挂起，再引入预拉镜像步骤。
#   - Windows runner 全步骤显式 shell: bash（历史教训：默认 PowerShell
#     不兼容 bash 语法）。
# =============================================================================

name: build-ohos

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# PUB_CACHE 必须与项目同盘且值内不得含 ".."：实测（实验 C，2026-10-18）
# 干净值下 pub 写绝对 rootUri 且与实际下载位置一致；含 ".." 的值（如
# workspace/../pub-cache）会导致 git 依赖 rootUri 指向 normalize 后位置、
# 实际下载落别处，kernel 编译报整批符号未定义。指向 workspace 内目录
# 同时满足 hvigor 对插件 srcPath 的相对路径要求（同盘）。
env:
  PUB_CACHE: ${{ github.workspace }}\pub-cache

jobs:
  ohos:
    name: HarmonyOS HAP (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v2
        with:
          version: "26.0.0.821"
          cache: true

      - name: Setup flutter-ohos SDK
        shell: bash
        run: |
          git clone --depth 1 -b 3.47.7-ohos-1.0.0 \
            https://atomgit.com/oh-flutter/flutter_flutter.git "$HOME/flutter-ohos"
          ls "$HOME/flutter-ohos/bin" | head -5
          echo "$(cygpath -w "$HOME/flutter-ohos/bin")" >> "$GITHUB_PATH"

      - name: Flutter doctor
        shell: bash
        run: |
          flutter.bat --version
          flutter.bat doctor || true

      - name: 获取依赖
        shell: bash
        run: |
          for i in 1 2 3; do
            timeout 900 flutter.bat pub get 2>&1 && exit 0
            echo "pub get failed or hung (attempt $i), retrying..."
            sleep 10
          done
          exit 1

      - name: 生成国际化资源
        shell: bash
        run: |
          flutter.bat gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true

      - name: 归一化 package_config 路径
        # pub 同盘缓存会把 git 依赖 rootUri 写成相对路径，而 hvigor 调起的
        # Dart 前端解析相对路径的基准错位导致 "cannot find path"（本机形态
        # 为绝对 file:/// URI，从不踩此坑）。相对基准存在歧义（项目根 or
        # .dart_tool），故对每个相对 rootUri 做双基准存在性探测，取真实
        # 存在者改写为绝对 URI；两者皆不存在则早失败并输出诊断。
        shell: bash
        run: |
          python - <<'PYEOF'
          import json, os, sys, urllib.request
          p = os.path.join(".dart_tool", "package_config.json")
          with open(p, encoding="utf-8") as f:
              cfg = json.load(f)
          base_dd = os.path.abspath(".dart_tool")
          base_root = os.path.abspath(".")
          n = 0
          bad = 0
          for pkg in cfg.get("packages", []):
              ru = pkg.get("rootUri", "")
              if ru.startswith("../") or ru.startswith("./"):
                  cands = [os.path.normpath(os.path.join(b, ru)) for b in (base_dd, base_root)]
                  hit = None
                  for c in cands:
                      if os.path.exists(os.path.join(c, "pubspec.yaml")):
                          hit = c
                          break
                  if hit is not None:
                      pkg["rootUri"] = "file:///" + hit.replace("\\", "/")
                      n += 1
                      if pkg.get("name") in ("shared_preferences", "url_launcher"):
                          print("::notice::resolved %s -> %s" % (pkg["name"], hit))
                  else:
                      bad += 1
                      print("::error::%s unresolvable: %s | c1=%s | c2=%s" % (pkg.get("name"), ru[:60], cands[0], cands[1]))
              elif ru.startswith("file:///"):
                  ok_abs = os.path.exists(os.path.normpath(urllib.request.url2pathname(ru[8:])))
                  if not ok_abs and pkg.get("name") in ("shared_preferences", "url_launcher"):
                      print("::error::%s absolute rootUri target missing: %s" % (pkg["name"], ru))
          with open(p, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
          print("normalized %d relative, %d unresolvable" % (n, bad))
          print("::notice::PUB_CACHE env = %s" % os.environ.get("PUB_CACHE", "<unset>"))
          # 关键包自检：改写后的绝对路径必须真实存在其 Dart 库文件，
          # 否则 kernel 阶段才失败的报错无法归因。失败时 annotation
          # 配额全空，此处诊断完整可见。
          missing = False
          for name, libf in (("shared_preferences", "lib/shared_preferences.dart"),
                              ("url_launcher", "lib/url_launcher.dart")):
              entry = next((x for x in cfg.get("packages", []) if x.get("name") == name), None)
              if entry is None:
                  print("::error::package %s missing from package_config" % name)
                  missing = True
                  continue
              ru = entry.get("rootUri", "")
              local = ru[8:] if ru.startswith("file:///") else None
              if local is None:
                  print("::error::%s rootUri not absolute: %s" % (name, ru))
                  missing = True
                  continue
              dart_file = os.path.normpath(os.path.join(local, libf))
              if os.path.exists(dart_file):
                  print("::notice::%s OK: %s" % (name, dart_file))
              else:
                  print("::error::%s lib missing: %s (rootUri=%s)" % (name, dart_file, ru))
                  missing = True
                  try:
                      norm = local.replace("\\", "/")
                      gi = norm.find("/git/")
                      if gi >= 0:
                          after = norm[gi + 5:]
                          repo_root = norm[:gi + 5] + after.split("/")[0]
                          cache_git = norm[:gi + 4]
                          print("::error::checkout-root %s listing: %s" % (repo_root, sorted(os.listdir(repo_root))[:14]))
                          print("::error::git-dir %s listing: %s" % (cache_git, sorted(os.listdir(cache_git))[:14]))
                  except Exception as e:
                      print("::error::listing failed: %s" % e)
          if bad or missing:
              sys.exit(1)
          PYEOF

      - name: 编译 HAP（release，未签名）
        shell: bash
        run: |
          set -o pipefail
          flutter.bat build hap --release --no-pub --target-platform ohos-arm64 \
            --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} \
            --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} \
            --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} \
            --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} \
            2>&1 | tee ohos_build.log || {
              echo "=== OHOS BUILD FAILED ==="
              tail -n 500 ohos_build.log
              # 首现的 import 解析错误优先（定位路径类根因），符号错误限量，
              # 为归一化/自检诊断 annotation 留出每 job 10 条的配额。
              grep -naE "Error when reading|Unable to read" ohos_build.log | head -n 6 | cut -c1-380 \
                | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
              grep -naE "error:|Error:" ohos_build.log | tail -n 8 | cut -c1-380 \
                | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
              exit 1; }

      - name: 收集产物
        shell: bash
        run: |
          cp ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
            NexHub-ohos-arm64-unsigned.hap
          ls -la NexHub-ohos-arm64-unsigned.hap

      - name: 上传构建日志（失败时）
        # 编译失败时把完整构建日志与 hvigor 详细日志（含 frontend_server
        # 真实参数与路径）作为 artifact；注：artifact 下载需认证，匿名侧
        # 依赖上方 annotation 通道。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ohos-build-log
          path: |
            ohos_build.log
            ohos/.hvigor/outputs/build-logs/
          if-no-files-found: ignore

      - name: 上传产物（手动试跑）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ohos-hap
          path: NexHub-ohos-arm64-unsigned.hap
          if-no-files-found: error

      - name: 发布到 GitHub Releases
        # ohos 标签时本工作流是唯一发布流（build.yml 各 job 对 ohos 标签跳过），
        # 由本步骤创建 Release 并写入正文；与 build.yml 共用同一份
        # RELEASE_BODY.md，两个工作流先后更新同一正文内容一致，互不冲突。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NexHub ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            NexHub-ohos-arm64-unsigned.hap
